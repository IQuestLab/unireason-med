hydra:
  searchpath:
  - file://verl/trainer/config

defaults:
- ppo_trainer
- _self_

data:
  max_prompt_length: 40960
  max_response_length: 2048
  train_batch_size: 128
  return_raw_chat: True
  return_multi_modal_inputs: False

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: vllm
    mode: async
    urm_enable_contrast_reward: False   # set True via CLI to enable contrastive grounding reward
    urm_contrast_logprobs_k: 20
    multi_turn:
      enable: False
    agent:
      default_agent_loop: urm_single_assistant
    engine_kwargs:
      vllm:
        max_logprobs: 20   # ensure top-20 logprobs are available for score_token_logprob calls
